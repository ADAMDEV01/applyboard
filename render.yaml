databases:
  - name: applyboard-db
    plan: free
    databaseName: applyboard
    user: applyboard

services:
  - type: web
    name: applyboard-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health/ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: applyboard-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          type: static
          name: applyboard-frontend
          property: host
      - key: RATE_LIMIT_STORAGE_URI
        value: memory://

  - type: static
    name: applyboard-frontend
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: applyboard-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: cron
    name: applyboard-follow-up-reminders
    runtime: docker
    schedule: "0 0 * * *"
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: python -m app.jobs.send_followup_reminders
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: applyboard-db
          property: connectionString
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
