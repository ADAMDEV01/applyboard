name: Capture demo screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: applyboard
          POSTGRES_PASSWORD: applyboard_local_password
          POSTGRES_DB: applyboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U applyboard -d applyboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://applyboard:applyboard_local_password@localhost:5432/applyboard
      JWT_SECRET: screenshot-only-secret-at-least-32-characters
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      RATE_LIMIT_STORAGE_URI: memory://
      COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
        working-directory: backend
      - run: python -m alembic upgrade head
        working-directory: backend
      - run: docker compose up --build -d --wait
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Capture screenshots without changing repository files
        working-directory: frontend
        run: |
          mkdir -p /tmp/applyboard-screenshots
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 1000 }, deviceScaleFactor: 1 });
          await page.goto('http://localhost:3000/login', { waitUntil: 'networkidle' });
          await page.getByRole('button', { name: 'Try the demo workspace' }).click();
          await page.getByRole('heading', { name: 'Good progress starts with a clear view.' }).waitFor();
          await page.screenshot({ path: '/tmp/applyboard-screenshots/dashboard.png', fullPage: true });
          await page.goto('http://localhost:3000/applications', { waitUntil: 'networkidle' });
          await page.locator('.company-link').first().waitFor();
          await page.screenshot({ path: '/tmp/applyboard-screenshots/applications.png', fullPage: true });
          await page.getByRole('link', { name: 'Northstar Labs' }).click();
          await page.getByRole('heading', { name: 'Activity history' }).waitFor();
          await page.screenshot({ path: '/tmp/applyboard-screenshots/application-history.png', fullPage: true });
          await browser.close();
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: applyboard-demo-screenshots
          path: /tmp/applyboard-screenshots/*.png
          if-no-files-found: error
      - if: always()
        run: docker compose logs && docker compose down -v
