name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: applyboard
          POSTGRES_PASSWORD: applyboard_ci_password
          POSTGRES_DB: applyboard_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U applyboard -d applyboard_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://applyboard:applyboard_ci_password@localhost:5432/applyboard_ci
      JWT_SECRET: ci-only-secret-value-at-least-32-characters
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
      RATE_LIMIT_STORAGE_URI: memory://
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: mypy app --ignore-missing-imports --follow-imports=silent
      - name: Apply PostgreSQL migrations
        run: python -m alembic upgrade head
      - name: Verify model and migration parity
        run: python -m alembic check
      - name: Run PostgreSQL integration tests
        run: python -m pytest -q tests/test_postgres_integration.py --no-cov
      - name: Run isolated SQLite unit and API tests
        run: python -m pytest -q --cov=app --cov-report=term-missing --cov-report=xml
      - name: Publish backend coverage
        uses: codecov/codecov-action@v5
        with:
          files: backend/coverage.xml
          fail_ci_if_error: false
      - name: Build and smoke-test Docker Compose
        run: |
          docker compose -f ../docker-compose.yml up --build -d --wait
          curl --retry 20 --retry-delay 2 --retry-connrefused -fsS http://localhost:8000/health/ready
          curl --retry 20 --retry-delay 2 --retry-connrefused -fsS http://localhost:3000/
      - name: Stop Docker Compose
        if: always()
        run: docker compose -f ../docker-compose.yml logs && docker compose -f ../docker-compose.yml down -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://api.example.invalid
